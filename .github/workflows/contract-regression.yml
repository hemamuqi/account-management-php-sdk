name: SDK contract regression

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'specs/openapi/**'
      - 'tools/contract-test/**'
      - '.github/workflows/contract-regression.yml'
      - 'composer.json'
      - 'composer.lock'
  pull_request:
    paths:
      - 'src/**'
      - 'specs/openapi/**'
      - 'tools/contract-test/**'
      - '.github/workflows/contract-regression.yml'
      - 'composer.json'
      - 'composer.lock'
  workflow_dispatch:
    inputs:
      include-errors:
        description: Include declared 4xx responses (currently reports known SDK mismatches)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  contract-test:
    uses: hemamuqi/account-management-java-sdk/.github/workflows/php-contract.yml@main
    with:
      include-errors: ${{ inputs.include-errors || false }}